spring.application.name=backend
server.port=8080

# ==============================================================================
# MySQL Database Configuration
# ==============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/student_grade_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# B.Tech Academic System Configuration
# ==============================================================================
# Configurable validation pattern for college roll number / enrollment ID (e.g. 21B91A0501, CS2026-101, 22CSE045)
app.academic.roll-number-regex=^[A-Za-z0-9\\-_/]{4,20}$# Default initial administrator password (hashed with BCrypt on startup if admin does not exist)
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:Admin@1234}
